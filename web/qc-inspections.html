<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QC — Kho NPL</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar" id="topbar"></div>

  <div class="page">
    <h1 data-i18n="qc.title">QC — Kiểm tra chất lượng</h1>
    <p class="subtitle" data-i18n="qc.subtitle">Tạo phiếu kiểm, chụp ảnh, gửi duyệt và duyệt để cập nhật trạng thái lô hàng</p>

    <div class="card" id="listCard">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;" data-i18n="qc.listTitle">Danh sách phiếu kiểm</h2>
        <button class="btn btn-primary btn-sm" onclick="toggleCreateForm()" data-i18n="qc.createBtn">+ Tạo phiếu kiểm mới</button>
      </div>
      <div id="listContainer" style="margin-top: 16px;" data-i18n="common.loading">Đang tải...</div>
    </div>

    <div class="card" id="createCard" style="display:none;">
      <h2 data-i18n="qc.createTitle">Tạo phiếu kiểm mới</h2>
      <div class="error-box" id="createError"></div>

      <div class="form-row">
        <label data-i18n="qc.lotLabel">Lô hàng cần kiểm *</label>
        <select id="f_lotId"></select>
        <div class="hint" data-i18n="qc.lotHint">Chỉ hiển thị các lô đang chờ kiểm (PENDING) hoặc đang kiểm (IN_PROGRESS)</div>
      </div>
      <div class="form-row">
        <label data-i18n="qc.resultLabel">Kết quả sơ bộ</label>
        <select id="f_result">
          <option value="" data-i18n="qc.resultNotChosen">— Chưa chọn (điền sau) —</option>
          <option value="PASSED" data-i18n="qc.resultPassed">Đạt (PASSED)</option>
          <option value="PARTIALLY_PASSED" data-i18n="qc.resultPartial">Đạt có điều kiện (PARTIALLY_PASSED)</option>
          <option value="FAILED" data-i18n="qc.resultFailed">Không đạt (FAILED)</option>
        </select>
      </div>
      <div class="form-row">
        <label data-i18n="qc.noteLabel">Ghi chú</label>
        <textarea id="f_notes"></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="submitCreateForm()" id="createSubmitBtn" data-i18n="qc.submitCreateBtn">Tạo phiếu (DRAFT)</button>
        <button class="btn btn-outline" onclick="toggleCreateForm()" data-i18n="qc.cancelBtn">Hủy</button>
      </div>
    </div>

    <div class="card" id="detailCard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;"><span data-i18n="qc.detailTitle">Chi tiết phiếu QC</span> #<span id="detailId"></span></h2>
        <button class="btn btn-outline btn-sm" onclick="closeDetail()" data-i18n="qc.closeBtn">Đóng</button>
      </div>
      <div class="success-box" id="detailSuccess"></div>
      <div class="error-box" id="detailError"></div>
      <div id="detailContainer"></div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/qc-inspections.js"></script>
</body>
</html>
