<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trợ giúp — Kho NPL</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .help-layout { display: flex; gap: 24px; align-items: flex-start; }
    .help-toc {
      position: sticky; top: 20px; min-width: 200px; max-width: 220px;
      background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    }
    .help-toc a {
      display: block; padding: 7px 10px; border-radius: 6px; font-size: 13.5px;
      color: var(--text); text-decoration: none; margin-bottom: 2px;
    }
    .help-toc a:hover { background: #f0f2fa; text-decoration: none; }
    .help-toc a.active { background: var(--navy); color: #fff; font-weight: 600; }
    .help-content { flex: 1; min-width: 0; }
    .help-section { scroll-margin-top: 20px; margin-bottom: 28px; }
    .help-section ol { padding-left: 22px; line-height: 1.8; }
    .help-section ol li { margin-bottom: 4px; }
    .faq-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .faq-item:last-child { border-bottom: none; }
    .faq-q { font-weight: 600; color: var(--navy); margin-bottom: 4px; }
    .faq-a { color: var(--text); font-size: 14px; line-height: 1.6; }
    @media (max-width: 800px) {
      .help-layout { flex-direction: column; }
      .help-toc { position: static; max-width: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="topbar" id="topbar"></div>

  <div class="page">
    <h1 data-i18n="help.pageTitle">Trợ giúp</h1>
    <p class="subtitle" data-i18n="help.pageSubtitle">Hướng dẫn sử dụng nhanh cho từng phần của hệ thống</p>

    <div class="help-layout">
      <nav class="help-toc" id="helpToc"></nav>
      <div class="help-content" id="helpContent">Đang tải...</div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/help.js"></script>
</body>
</html>
