<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xe công vụ — SEC ERP</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar" id="topbar"></div>

  <div class="page">
    <h1 data-i18n="vehicle.title">Xe công vụ</h1>
    <p class="subtitle" data-i18n="vehicle.subtitle">Đăng ký sử dụng xe công vụ, gửi duyệt qua Quản lý trực tiếp rồi Admin (điều phối xe)</p>

    <!-- ============ DANH SACH ============ -->
    <div class="card" id="listCard">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;" data-i18n="vehicle.listTitle">Danh sách đăng ký</h2>
        <button class="btn btn-primary btn-sm" onclick="toggleCreateForm()" data-i18n="vehicle.createBtn">+ Tạo đăng ký mới</button>
      </div>
      <div id="listContainer" style="margin-top: 16px;" data-i18n="common.loading">Đang tải...</div>
    </div>

    <!-- ============ FORM TAO MOI ============ -->
    <div class="card" id="createCard" style="display:none;">
      <h2 data-i18n="vehicle.createTitle">Tạo đăng ký xe công vụ mới</h2>
      <div class="error-box" id="createError"></div>

      <div class="form-grid cols-3">
        <div class="form-row">
          <label data-i18n="vehicle.dateLabel">Ngày sử dụng *</label>
          <input type="date" id="f_useDate" />
        </div>
        <div class="form-row">
          <label data-i18n="vehicle.startTimeLabel">Giờ bắt đầu *</label>
          <input type="time" id="f_startTime" />
        </div>
        <div class="form-row">
          <label data-i18n="vehicle.endTimeLabel">Giờ kết thúc *</label>
          <input type="time" id="f_endTime" />
        </div>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label data-i18n="vehicle.departureLabel">Điểm đi *</label>
          <input type="text" id="f_departure" />
        </div>
        <div class="form-row">
          <label data-i18n="vehicle.destinationLabel">Điểm đến *</label>
          <input type="text" id="f_destination" />
        </div>
      </div>
      <div class="form-row">
        <label data-i18n="vehicle.purposeLabel">Mục đích *</label>
        <textarea id="f_purpose"></textarea>
      </div>
      <div class="form-row">
        <label data-i18n="vehicle.numberOfPeopleLabel">Số người *</label>
        <input type="number" min="1" id="f_numberOfPeople" value="1" />
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="submitCreateForm()" data-i18n="vehicle.submitCreateBtn">Tạo đăng ký</button>
        <button class="btn btn-outline" onclick="toggleCreateForm()" data-i18n="common.cancel">Hủy</button>
      </div>
    </div>

    <!-- ============ CHI TIET ============ -->
    <div class="card" id="detailCard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;"><span data-i18n="vehicle.detailTitle">Chi tiết đăng ký</span> <span id="detailCode"></span></h2>
        <button class="btn btn-outline btn-sm" onclick="closeDetail()" data-i18n="common.close">Đóng</button>
      </div>
      <div class="success-box" id="detailSuccess"></div>
      <div class="error-box" id="detailError"></div>
      <div id="detailContainer"></div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/vehicle-booking-requests.js"></script>
</body>
</html>
